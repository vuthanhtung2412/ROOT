<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Co-op empty slot detail</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2118;--ink-soft:#5b4a36;--parchment:#efe3c4;--parchment-deep:#d8c79c;--parchment-shadow:#cbb892;--cream-deep:#e6d6ae;--gold:#c99a2e;--gold-light:#f4dc95;--gold-deep:#8a6a22;--wood:#5b3d26;--steel:#9fb0bd}
body{margin:0;background:radial-gradient(ellipse at 50% 20%,#4a3a28,#1c1610 75%);font-family:'Alegreya Sans',sans-serif;color:var(--parchment);padding:28px 32px 60px}
h1{font:600 28px Fraunces,serif;margin:0 0 6px}
.lead{margin:0 0 26px;color:#d9c9a3;max-width:900px}
.option{margin:0 0 34px;padding:18px 22px 26px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(239,227,196,.15)}
.option h2{font:600 22px Fraunces,serif;margin:0 0 4px;color:var(--gold-light)}
.option p{margin:0 0 18px;color:#d9c9a3;max-width:900px}
.pick{font:700 12px 'Alegreya Sans';letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.base{font:700 12px 'Alegreya Sans';letter-spacing:.08em;text-transform:uppercase;background:#7a6448;color:var(--parchment);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.table{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;gap:40px}
.grid{display:grid;grid-template-columns:repeat(2,auto);gap:20px 32px;margin:0;padding:0;list-style:none}
.seat{display:flex;flex-direction:column;align-items:center}
.tile{position:relative;box-sizing:border-box;width:128px;height:128px;padding:6px;border-radius:5px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--ink),0 6px 14px rgba(0,0,0,.45)}
.tile>img.portrait{width:100%;height:100%;object-fit:cover;display:block}
.medal{position:absolute;top:-13px;left:-13px;width:34px;height:34px;border-radius:50%;background:var(--parchment-deep);border:2px solid var(--ink);color:var(--ink);font:600 15px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.medal.gold{background:var(--gold)}
.label{position:relative;z-index:1;margin-top:-8px;box-sizing:border-box;min-width:128px;padding:4px 12px;text-align:center;background:var(--parchment);color:var(--ink);border-radius:3px;box-shadow:0 0 0 1.5px var(--ink)}
.label b{display:block;font:600 16px Fraunces,serif;line-height:1.2}
.label i{display:block;font:italic 400 13px 'Alegreya Sans';color:var(--ink-soft)}
.label.gold{background:var(--gold-light)}
.label.open{background:var(--parchment-deep)}
.vs{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--ink);box-shadow:0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font:600 26px Fraunces,serif}
.r1{transform:rotate(-2deg)}.r2{transform:rotate(1deg)}.r3{transform:rotate(-1deg)}.r4{transform:rotate(2deg)}
.qmark{font:600 72px Fraunces,serif;color:var(--ink)}
.plus{font:400 64px Fraunces,serif;color:var(--ink)}

/* Shared: today's stitched card slot (baseline) */
.slot{background:var(--wood);box-shadow:inset 0 3px 10px rgba(0,0,0,.6),0 0 0 2px var(--ink)}
.slot::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(239,227,196,.45);border-radius:3px;box-shadow:inset 0 3px 10px rgba(0,0,0,.6);pointer-events:none}
.slot-label{background:color-mix(in srgb,var(--wood) 80%,var(--parchment));box-shadow:0 0 0 1.5px var(--ink)}
.slot-label b{color:var(--parchment)}.slot-label i{color:var(--parchment-shadow)}

/* 1 · suit watermark engraved into the wood */
.suit{width:58px;height:58px;object-fit:contain;filter:grayscale(1) brightness(2.2) sepia(.4);opacity:.22;mix-blend-mode:screen}
.suit.bot{filter:grayscale(1) brightness(2.4);opacity:.18}
.cog{width:56px;height:56px;stroke:var(--steel);opacity:.32}

/* 4 · brass nail heads on the stitch corners */
.nail{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold) 45%,var(--gold-deep));box-shadow:0 1px 2px rgba(0,0,0,.7);z-index:1}
.nail.tl{top:6px;left:6px}.nail.tr{top:6px;right:6px}.nail.bl{bottom:6px;left:6px}.nail.br{bottom:6px;right:6px}

/* 5 · ghost seat medallion: dashed, no digit */
.ghost-medal{position:absolute;top:-13px;left:-13px;width:34px;height:34px;border-radius:50%;box-sizing:border-box;border:2px dashed rgba(239,227,196,.55);background:rgba(28,22,16,.55)}

/* 6 · ruin marker half-buried in a corner */
.ruin{position:absolute;right:12px;bottom:12px;width:40px;height:40px;object-fit:contain;transform:rotate(-14deg);opacity:.3;filter:grayscale(.6)}
.leaf{position:absolute;width:22px;height:22px;stroke:var(--gold);opacity:.35}
.leaf.a{top:16px;right:18px;transform:rotate(30deg)}.leaf.b{bottom:18px;left:16px;transform:rotate(-50deg)}
</style>
</head>
<body>
<h1>Co-op lobby · empty slot detail</h1>
<p class="lead">Every row shows the same table: Woodland 2x2 (you, an open seat, 2 empty slots) vs Clockwork 2x2 (a bot, "Add a bot", 2 empty slots). Only the empty slots change. Base = today's stitched slot (option C).</p>

<template id="cog-icon"><svg class="cog" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></template>
<template id="leaf-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></template>

<div id="options"></div>

<script>
const ASSETS = '../../../frontend/react/public/assets/'
const PORTRAITS = ASSETS + 'portraits/'
const SUITS = ['fox', 'rabbit', 'mouse', 'bird']
const DEFAULT_TEXT = { human: ['Empty', '—'], bot: ['Empty', '—'] }
const SIDE_TEXT = { human: ['Unclaimed clearing', 'no warband'], bot: ['Idle gears', 'no automaton'] }
const REASON_TEXT = { human: ['Empty', 'woodland · 1 / 4'], bot: ['Empty', 'clockwork · 1 / 2 bots'] }

const OPTIONS = [
  { key: 'base', title: 'Base · today', base: true,
    blurb: 'The stitched slot with "Empty" and "—". Calm, but the slot carries no information.',
    features: [], text: DEFAULT_TEXT },
  { key: '1', title: '1 · Suit watermark',
    blurb: 'A faded suit icon engraved into the wood, picked by slotIndex % 4 (fox / rabbit / mouse / bird). The Clockwork side gets a steel cog instead. Uses assets/suits/*.webp.',
    features: ['suit'], text: DEFAULT_TEXT },
  { key: '2', title: '2 · Side-specific text',
    blurb: 'Same slot; the strip describes the side. Woodland: "Unclaimed clearing / no warband". Clockwork: "Idle gears / no automaton". Needs a `side` prop.',
    features: [], text: SIDE_TEXT },
  { key: '3', title: '3 · Reason note',
    blurb: 'The note says how full the side is: "woodland · 1 / 4", "clockwork · 1 / 2 bots". Most useful to read, but the tile needs the seat and bot counts passed down.',
    features: [], text: REASON_TEXT },
  { key: '4', title: '4 · Brass nails',
    blurb: 'Four brass nail heads pin the stitch to the table. Same medallion feel as the live tiles. Pure CSS.',
    features: ['nails'], text: DEFAULT_TEXT },
  { key: '5', title: '5 · Ghost medallion',
    blurb: 'A dashed medallion with no digit where the seat number would be. Keeps the 2x2 rhythm without looking like a real seat.',
    features: ['ghost'], text: DEFAULT_TEXT },
  { key: '6', title: '6 · Ruin + fallen leaves',
    blurb: 'A ruin marker half-buried in a corner, plus a couple of leaves. Most flavour and most noise.',
    features: ['ruin'], text: DEFAULT_TEXT },
  { key: 'combo', title: '1 + 2 + 4 · Combo', pick: true,
    blurb: 'Suit watermark, side-specific text and brass nails together. Props grow to { slotIndex, side }; no new assets or CSS files.',
    features: ['suit', 'nails'], text: SIDE_TEXT },
  { key: 'max', title: '1 + 2 + 4 + 5 · Everything calm',
    blurb: 'The combo plus the ghost medallion. Check whether the ghost medallion pulls the eye away from the real open seat.',
    features: ['suit', 'nails', 'ghost'], text: SIDE_TEXT },
]

function template(id) { return document.getElementById(id).innerHTML }

function seatHtml({ tileClass, tileStyle, tileInner, labelClass, title, note, medal }) {
  return `<li class="seat"><div class="tile ${tileClass}" style="${tileStyle ?? ''}">${tileInner}${medal ?? ''}</div>
    <div class="label ${labelClass}"><b>${title}</b><i>${note}</i></div></li>`
}

function emptyHtml(option, side, slotIndex, tilt) {
  const has = (feature) => option.features.includes(feature)
  let inner = ''
  if (has('suit')) inner += side === 'bot' ? template('cog-icon') : `<img class="suit" src="${ASSETS}suits/${SUITS[slotIndex % SUITS.length]}.webp" alt="">`
  if (has('nails')) inner += ['tl', 'tr', 'bl', 'br'].map((corner) => `<span class="nail ${corner}"></span>`).join('')
  if (has('ghost')) inner += '<span class="ghost-medal"></span>'
  if (has('ruin')) inner += `<img class="ruin" src="${ASSETS}markers/ruin.webp" alt=""><span class="leaf a">${template('leaf-icon')}</span><span class="leaf b">${template('leaf-icon')}</span>`
  const [title, note] = option.text[side]
  return seatHtml({ tileClass: `slot ${tilt}`, tileInner: inner, labelClass: 'slot-label', title, note })
}

function rowHtml(option) {
  const humans = [
    seatHtml({ tileClass: 'r1', tileInner: `<img class="portrait" src="${PORTRAITS}alliance.webp" alt="">`, labelClass: 'gold', title: 'Woodland Alliance', note: 'you · host', medal: '<span class="medal gold">1</span>' }),
    seatHtml({ tileClass: 'r2', tileStyle: 'background:var(--cream-deep)', tileInner: '<span class="qmark">?</span>', labelClass: 'open', title: 'Open seat', note: 'waiting…', medal: '<span class="medal">2</span>' }),
    emptyHtml(option, 'human', 2, 'r3'),
    emptyHtml(option, 'human', 3, 'r4'),
  ].join('')
  const bots = [
    seatHtml({ tileClass: 'r2', tileInner: `<img class="portrait" src="${PORTRAITS}electricEyrie.webp" alt="">`, labelClass: '', title: 'Electric Eyrie', note: 'Default · no trait', medal: '<span class="medal">3</span>' }),
    seatHtml({ tileClass: 'r3', tileStyle: 'background:var(--cream-deep)', tileInner: '<span class="plus">+</span>', labelClass: 'open', title: 'Add a bot', note: 'open seat' }),
    emptyHtml(option, 'bot', 2, 'r1'),
    emptyHtml(option, 'bot', 3, 'r4'),
  ].join('')
  const badge = option.pick ? '<span class="pick">my pick</span>' : option.base ? '<span class="base">current</span>' : ''
  return `<section class="option"><h2>${option.title}${badge}</h2><p>${option.blurb}</p>
    <div class="table"><ol class="grid">${humans}</ol><span class="vs">VS</span><ul class="grid">${bots}</ul></div></section>`
}

document.getElementById('options').innerHTML = OPTIONS.map(rowHtml).join('')
</script>
</body>
</html>
