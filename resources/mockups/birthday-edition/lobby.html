<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birthday lobby</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Bangers&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a63d58}a:hover{color:#7c2a40}
</style>
</head>
<body>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #24362e; font-family: Georgia, 'Times New Roman', serif; color: #2c2118">
  <img src="../../reference/wallpapers/ulrick-wery-riverside.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1)">
  <div style="position: absolute; inset: 0; background: rgba(26,20,8,0.55)"></div>

  <svg aria-hidden="true" width="1440" height="110" viewBox="0 0 1440 110" style="position: absolute; left: 0; top: 0">
    <path d="M-10 12 Q 720 96 1450 12" fill="none" stroke="#1a1408" stroke-width="3"></path>
    <polygon points="70,22 112,30 86,76" fill="#f2b8c6" stroke="#1a1408" stroke-width="3"></polygon>
    <polygon points="200,36 242,42 216,88" fill="#c9b530" stroke="#1a1408" stroke-width="3"></polygon>
    <polygon points="330,46 372,50 348,96" fill="#7fb3d5" stroke="#1a1408" stroke-width="3"></polygon>
    <polygon points="460,52 502,54 480,100" fill="#9fcfb0" stroke="#1a1408" stroke-width="3"></polygon>
    <polygon points="938,54 980,52 960,100" fill="#9fcfb0" stroke="#1a1408" stroke-width="3"></polygon>
    <polygon points="1068,50 1110,46 1090,96" fill="#7fb3d5" stroke="#1a1408" stroke-width="3"></polygon>
    <polygon points="1198,42 1240,36 1218,88" fill="#c9b530" stroke="#1a1408" stroke-width="3"></polygon>
    <polygon points="1328,30 1370,22 1350,76" fill="#f2b8c6" stroke="#1a1408" stroke-width="3"></polygon>
  </svg>

  <div style="position: absolute; left: 0; right: 0; top: 50px; display: flex; flex-direction: column; align-items: center; gap: 40px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <h1 style="margin: 0; padding: 6px 30px; background: #f0e6d3; border: 3px solid #1a1408; box-shadow: 2px 3px 0 rgba(26,20,8,0.4); font-family: 'IM Fell English', Georgia, serif; font-weight: 400; font-size: 34px; letter-spacing: 0.04em">The Birthday Table</h1>
      <p style="margin: 0; padding: 3px 16px; background: #a63d58; color: #fff8e6; border: 3px solid #1a1408; transform: rotate(-2deg); font-style: italic; font-size: 16px">2 of 4 guests seated</p>
    </div>

    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: row; align-items: flex-start; gap: 44px">
      <li style="display: flex; flex-direction: column; align-items: center">
        <div style="position: relative; width: 200px; height: 200px; padding: 8px; box-sizing: border-box; background: #c9b530; border: 3px solid #1a1408; transform: rotate(-2deg) scale(1.05); box-shadow: 0 0 0 5px #b08a3a, 2px 3px 0 rgba(26,20,8,0.4)">
          <img src="../../reference/character-portraits/lizard-cult.png" alt="Lizard Cult" style="display: block; width: 100%; height: 100%; object-fit: cover">
          <svg aria-hidden="true" width="220" height="48" viewBox="0 0 220 48" style="position: absolute; left: -13px; top: -18px">
            <path d="M2 6 Q 110 32 218 6" fill="none" stroke="#1a1408" stroke-width="3"></path>
            <polygon points="30,11 54,16 40,44" fill="#f2b8c6" stroke="#1a1408" stroke-width="2.5"></polygon>
            <polygon points="74,19 98,21 86,48" fill="#7fb3d5" stroke="#1a1408" stroke-width="2.5"></polygon>
            <polygon points="122,21 146,19 134,48" fill="#fbe9a8" stroke="#1a1408" stroke-width="2.5"></polygon>
            <polygon points="166,16 190,11 180,44" fill="#a63d58" stroke="#1a1408" stroke-width="2.5"></polygon>
          </svg>
          <span aria-hidden="true" style="position: absolute; right: -16px; top: 60px; width: 12px; height: 7px; background: #7fb3d5; border: 2px solid #1a1408; transform: rotate(30deg)"></span>
          <span aria-hidden="true" style="position: absolute; left: -18px; top: 90px; width: 7px; height: 13px; background: #f2b8c6; border: 2px solid #1a1408; transform: rotate(-24deg)"></span>
          <span aria-hidden="true" style="position: absolute; right: -14px; bottom: 40px; width: 9px; height: 9px; border-radius: 50%; background: #fbe9a8; border: 2px solid #1a1408"></span>
          <span aria-hidden="true" style="position: absolute; left: -12px; bottom: 24px; width: 12px; height: 7px; background: #9fcfb0; border: 2px solid #1a1408; transform: rotate(-40deg)"></span>
          <span style="position: absolute; left: -14px; top: -14px; width: 36px; height: 36px; border-radius: 50%; background: #5b3d26; color: #fff8e6; border: 3px solid #1a1408; display: flex; align-items: center; justify-content: center; font-family: 'IM Fell English', Georgia, serif; font-size: 20px">1</span>
        </div>
        <div style="position: relative; z-index: 1; margin-top: -8px; min-width: 168px; padding: 6px 18px; box-sizing: border-box; background: #fbe9a8; border: 3px solid #1a1408; text-align: center">
          <span style="display: block; font-family: 'IM Fell English', Georgia, serif; font-size: 21px; line-height: 1.2">Lizard Cult</span>
          <span style="display: block; font-size: 14px; font-style: italic; color: #4a3a2c">You · host</span>
        </div>
      </li>

      <li style="display: flex; flex-direction: column; align-items: center">
        <div style="position: relative; width: 200px; height: 200px; padding: 8px; box-sizing: border-box; background: #c45c26; border: 3px solid #1a1408; transform: rotate(1deg); box-shadow: 2px 3px 0 rgba(26,20,8,0.4)">
          <img src="../../reference/character-portraits/marquise.png" alt="Marquise de Cat" style="display: block; width: 100%; height: 100%; object-fit: cover">
          <span style="position: absolute; left: -14px; top: -14px; width: 36px; height: 36px; border-radius: 50%; background: #5b3d26; color: #fff8e6; border: 3px solid #1a1408; display: flex; align-items: center; justify-content: center; font-family: 'IM Fell English', Georgia, serif; font-size: 20px">2</span>
        </div>
        <div style="position: relative; z-index: 1; margin-top: -8px; min-width: 168px; padding: 6px 18px; box-sizing: border-box; background: #f0e6d3; border: 3px solid #1a1408; text-align: center">
          <span style="display: block; font-family: 'IM Fell English', Georgia, serif; font-size: 21px; line-height: 1.2">Marquise de Cat</span>
          <span style="display: block; font-size: 14px; font-style: italic; color: #4a3a2c">[GUEST NAME]</span>
        </div>
      </li>

      <li aria-hidden="true" style="align-self: center; margin: 0 -18px; transform: rotate(-6deg)">
        <div style="padding: 14px 22px; background: #f2b8c6; border: 3px solid #1a1408; border-radius: 48% 52% 44% 56% / 58% 46% 54% 42%; box-shadow: 3px 4px 0 rgba(26,20,8,0.45); font-family: 'Bangers', Impact, sans-serif; font-size: 40px; letter-spacing: 0.04em; color: #1a1408">PARTY!</div>
      </li>

      <li style="display: flex; flex-direction: column; align-items: center">
        <div style="position: relative; width: 200px; height: 200px; box-sizing: border-box; background: #7fb3d5; border: 3px solid #1a1408; transform: rotate(-1deg); box-shadow: 2px 3px 0 rgba(26,20,8,0.4)">
          <div style="position: absolute; left: 86px; top: 0; bottom: 0; width: 22px; background: #a63d58; border-left: 3px solid #1a1408; border-right: 3px solid #1a1408"></div>
          <div style="position: absolute; top: 86px; left: 0; right: 0; height: 22px; background: #a63d58; border-top: 3px solid #1a1408; border-bottom: 3px solid #1a1408"></div>
          <svg aria-hidden="true" width="90" height="50" viewBox="0 0 90 50" style="position: absolute; left: 52px; top: -34px">
            <path d="M45 44 C 20 10, 2 20, 10 40 Z" fill="#a63d58" stroke="#1a1408" stroke-width="3" stroke-linejoin="round"></path>
            <path d="M45 44 C 70 10, 88 20, 80 40 Z" fill="#a63d58" stroke="#1a1408" stroke-width="3" stroke-linejoin="round"></path>
            <circle cx="45" cy="42" r="7" fill="#c9b530" stroke="#1a1408" stroke-width="3"></circle>
          </svg>
          <span style="position: absolute; left: -14px; top: -14px; width: 36px; height: 36px; border-radius: 50%; background: #5b3d26; color: #fff8e6; border: 3px solid #1a1408; display: flex; align-items: center; justify-content: center; font-family: 'IM Fell English', Georgia, serif; font-size: 20px">3</span>
        </div>
        <div style="position: relative; z-index: 1; margin-top: -8px; min-width: 168px; padding: 6px 18px; box-sizing: border-box; background: #e4d4b8; border: 3px solid #1a1408; text-align: center">
          <span style="display: block; font-family: 'IM Fell English', Georgia, serif; font-size: 21px; line-height: 1.2">Open seat</span>
          <span style="display: block; font-size: 14px; font-style: italic; color: #4a3a2c">A gift awaits</span>
        </div>
      </li>

      <li style="display: flex; flex-direction: column; align-items: center">
        <div style="position: relative; width: 200px; height: 200px; box-sizing: border-box; background: #9fcfb0; border: 3px solid #1a1408; transform: rotate(2deg); box-shadow: 2px 3px 0 rgba(26,20,8,0.4)">
          <div style="position: absolute; left: 86px; top: 0; bottom: 0; width: 22px; background: #c9b530; border-left: 3px solid #1a1408; border-right: 3px solid #1a1408"></div>
          <div style="position: absolute; top: 86px; left: 0; right: 0; height: 22px; background: #c9b530; border-top: 3px solid #1a1408; border-bottom: 3px solid #1a1408"></div>
          <svg aria-hidden="true" width="90" height="50" viewBox="0 0 90 50" style="position: absolute; left: 52px; top: -34px">
            <path d="M45 44 C 20 10, 2 20, 10 40 Z" fill="#c9b530" stroke="#1a1408" stroke-width="3" stroke-linejoin="round"></path>
            <path d="M45 44 C 70 10, 88 20, 80 40 Z" fill="#c9b530" stroke="#1a1408" stroke-width="3" stroke-linejoin="round"></path>
            <circle cx="45" cy="42" r="7" fill="#f2b8c6" stroke="#1a1408" stroke-width="3"></circle>
          </svg>
          <span style="position: absolute; left: -14px; top: -14px; width: 36px; height: 36px; border-radius: 50%; background: #5b3d26; color: #fff8e6; border: 3px solid #1a1408; display: flex; align-items: center; justify-content: center; font-family: 'IM Fell English', Georgia, serif; font-size: 20px">4</span>
        </div>
        <div style="position: relative; z-index: 1; margin-top: -8px; min-width: 168px; padding: 6px 18px; box-sizing: border-box; background: #e4d4b8; border: 3px solid #1a1408; text-align: center">
          <span style="display: block; font-family: 'IM Fell English', Georgia, serif; font-size: 21px; line-height: 1.2">Open seat</span>
          <span style="display: block; font-size: 14px; font-style: italic; color: #4a3a2c">Seat an AI guest</span>
        </div>
      </li>
    </ul>

    <div style="position: relative; margin-top: 30px; padding: 14px; background: #dfc99a; border: 3px solid #1a1408; box-shadow: 2px 3px 0 rgba(26,20,8,0.4)">
      <span style="position: absolute; left: 12px; bottom: 100%; padding: 2px 14px; background: #c9a04a; border: 3px solid #1a1408; border-bottom: 0; font-family: 'IM Fell English', Georgia, serif; font-size: 18px">Seat 1 · change your faction</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
        <button type="button" aria-label="Marquise de Cat" style="width: 92px; height: 92px; padding: 6px; box-sizing: border-box; background: #f6e7bd; border: 3px solid #1a1408; cursor: pointer"><img src="../../reference/character-portraits/marquise.png" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0.35"></button>
        <button type="button" aria-label="Eyrie Dynasties" style="width: 92px; height: 92px; padding: 6px; box-sizing: border-box; background: #f6e7bd; border: 3px solid #1a1408; cursor: pointer"><img src="../../reference/character-portraits/eyrie.png" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover"></button>
        <button type="button" aria-label="Woodland Alliance" style="width: 92px; height: 92px; padding: 6px; box-sizing: border-box; background: #f6e7bd; border: 3px solid #1a1408; cursor: pointer"><img src="../../reference/character-portraits/woodland.png" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover"></button>
        <button type="button" aria-label="Vagabond" style="width: 92px; height: 92px; padding: 6px; box-sizing: border-box; background: #f6e7bd; border: 3px solid #1a1408; cursor: pointer"><img src="../../reference/character-portraits/vagabond.png" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover"></button>
        <button type="button" aria-label="Lizard Cult, picked" style="position: relative; width: 92px; height: 92px; padding: 6px; box-sizing: border-box; background: #fbe9a8; border: 3px solid #1a1408; box-shadow: 0 0 0 5px #b08a3a; cursor: pointer">
          <img src="../../reference/character-portraits/lizard-cult.png" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover">
          <span aria-hidden="true" style="position: absolute; left: 10px; top: -14px; width: 10px; height: 6px; background: #f2b8c6; border: 2px solid #1a1408; transform: rotate(24deg)"></span>
          <span aria-hidden="true" style="position: absolute; right: 12px; top: -16px; width: 6px; height: 10px; background: #7fb3d5; border: 2px solid #1a1408; transform: rotate(-18deg)"></span>
          <span aria-hidden="true" style="position: absolute; left: 42px; top: -18px; width: 7px; height: 7px; border-radius: 50%; background: #a63d58; border: 2px solid #1a1408"></span>
        </button>
        <button type="button" aria-label="Riverfolk Company" style="width: 92px; height: 92px; padding: 6px; box-sizing: border-box; background: #f6e7bd; border: 3px solid #1a1408; cursor: pointer"><img src="../../reference/character-portraits/riverfolk.png" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover"></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: row; gap: 24px; align-items: center">
      <button type="button" style="min-height: 52px; padding: 8px 26px; background: #8f3d27; color: #f0e6d3; border: 3px solid #1a1408; box-shadow: 2px 3px 0 rgba(26,20,8,0.45); font-family: 'IM Fell English', Georgia, serif; font-size: 22px; cursor: pointer">Leave lobby</button>
      <button type="button" style="position: relative; min-height: 52px; padding: 8px 40px; background: #f2b8c6; color: #2c2118; border: 3px solid #1a1408; box-shadow: 2px 3px 0 rgba(26,20,8,0.45); font-family: 'IM Fell English', Georgia, serif; font-size: 24px; cursor: pointer">
        Light the candles
        <span aria-hidden="true" style="position: absolute; right: 14px; top: -20px; width: 7px; height: 22px; background: repeating-linear-gradient(180deg, #fff8e6 0 5px, #a63d58 5px 10px); border: 2px solid #1a1408"></span>
        <span aria-hidden="true" style="position: absolute; right: 12px; top: -36px; width: 11px; height: 16px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #f5a623; border: 2px solid #1a1408"></span>
      </button>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 140px; top: 260px; width: 14px; height: 8px; background: #f2b8c6; border: 2px solid #1a1408; transform: rotate(24deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 1290px; top: 230px; width: 10px; height: 16px; background: #c9b530; border: 2px solid #1a1408; transform: rotate(-18deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 1200px; top: 640px; width: 16px; height: 8px; background: #7fb3d5; border: 2px solid #1a1408; transform: rotate(60deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 220px; top: 700px; width: 12px; height: 12px; border-radius: 50%; background: #fbe9a8; border: 2px solid #1a1408"></div>
  <div aria-hidden="true" style="position: absolute; left: 90px; top: 520px; width: 14px; height: 8px; background: #9fcfb0; border: 2px solid #1a1408; transform: rotate(-36deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 1340px; top: 470px; width: 12px; height: 12px; border-radius: 50%; background: #b55238; border: 2px solid #1a1408"></div>
</div>
</body>
</html>
